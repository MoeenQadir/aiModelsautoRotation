# Failure Classification
failure_classification:
  MODEL_ERROR:
    recovery: "retry_same_model"
    max_retries: 2
    fallback: "next_model_in_group"
  
  PROVIDER_ERROR:
    recovery: "litellm_failover"
    max_retries: 3
    fallback: "next_provider"
  
  RATE_LIMIT:
    recovery: "rotate_deployment"
    max_retries: 3
    cooldown_seconds: 300
    fallback: "next_model_in_group"
  
  TIMEOUT:
    recovery: "retry_with_longer_timeout"
    max_retries: 2
    fallback: "next_model_in_group"
  
  CONTEXT_LIMIT:
    recovery: "compact_context_or_use_larger_context_model"
    max_retries: 2
    fallback: "model_with_larger_context"
  
  TOOL_ERROR:
    recovery: "fix_tool_call_and_retry"
    max_retries: 2
    fallback: "capability_handoff"
  
  PERMISSION_ERROR:
    recovery: "find_capable_model"
    max_retries: 0
    fallback: "capability_handoff"
  
  CAPABILITY_ERROR:
    recovery: "capability_aware_handoff"
    max_retries: 0
    fallback: "find_model_with_required_capability"
  
  NETWORK_ERROR:
    recovery: "retry_with_backoff"
    max_retries: 3
    fallback: "next_provider"
  
  SYNTAX_ERROR:
    recovery: "create_fix_todo"
    max_retries: 0
    fallback: "review_and_fix"
  
  BUILD_ERROR:
    recovery: "create_fix_todo"
    max_retries: 0
    fallback: "review_and_fix"
  
  TEST_FAILURE:
    recovery: "create_fix_todo"
    max_retries: 0
    fallback: "review_and_fix"
  
  DEPENDENCY_ERROR:
    recovery: "install_dependency_or_find_alternative"
    max_retries: 1
    fallback: "create_fix_todo"
  
  AUTH_ERROR:
    recovery: "rotate_api_key_or_provider"
    max_retries: 1
    fallback: "next_provider"
  
  UNKNOWN_ERROR:
    recovery: "log_and_retry"
    max_retries: 2
    fallback: "next_model_in_group"

# Capability Mapping
capabilities:
  coding:
    description: "General coding and implementation"
    required_for: ["implementation", "refactoring", "bug_fix"]
  
  reasoning:
    description: "Complex reasoning and analysis"
    required_for: ["planning", "architecture", "debugging"]
  
  planning:
    description: "Task planning and decomposition"
    required_for: ["planning", "task_breakdown"]
  
  long_context:
    description: "Large context window handling"
    required_for: ["large_file_analysis", "full_repo_context"]
  
  file_read:
    description: "Read files from filesystem"
    required_for: ["exploration", "code_review", "analysis"]
  
  file_write:
    description: "Write files to filesystem"
    required_for: ["implementation", "file_creation", "modification"]
  
  shell:
    description: "Execute shell commands"
    required_for: ["build", "test", "git", "system_operations"]
  
  git:
    description: "Git operations"
    required_for: ["version_control", "diff", "commit"]
  
  testing:
    description: "Run and write tests"
    required_for: ["verification", "test_driven_development"]
  
  debugging:
    description: "Debugging and troubleshooting"
    required_for: ["bug_fix", "error_analysis"]
  
  web:
    description: "Web search and fetch"
    required_for: ["research", "documentation_lookup"]
  
  structured_output:
    description: "Structured output formatting"
    required_for: ["json_output", "api_integration"]
  
  large_context:
    description: "Large context window (100k+ tokens)"
    required_for: ["large_project_analysis", "multi_file_context"]
  
  fast_response:
    description: "Fast token generation"
    required_for: ["interactive", "quick_iterations"]