# MoonAI Orchestration Configuration
# All orchestration parameters are configurable here

orchestration:
  # Task State
  task_state_dir: ".moon/tasks"
  log_dir: ".moon/logs"
  
  # Execution Control
  max_model_retries: 3
  max_handoffs: 5
  max_review_cycles: 3
  max_recovery_cycles: 5
  max_context_tokens: 100000
  
  # Auto Features
  enable_auto_handoff: true
  enable_auto_review: true
  enable_auto_test: true
  enable_context_compaction: true
  enable_continuous_execution: true
  
  # Verification
  require_tests_pass: true
  require_build_pass: true
  require_lint_pass: true
  require_typecheck_pass: true
  
  # Model Selection
  prefer_same_model: true
  handoff_timeout_seconds: 120
  task_timeout_minutes: 60
  
  # Context Compaction
  compaction_threshold_tokens: 80000
  compaction_keep_recent: 5
  compaction_summary_max_tokens: 5000
  
  # Safety
  allowed_destructive_operations: []
  blocked_paths:
    - "~/.ssh"
    - "~/.aws"
    - "~/.config/gcloud"
    - "/etc"
    - "C:\\Windows"
  require_explicit_confirmation_for:
    - "rm -rf"
    - "format"
    - "delete database"
    - "drop table"

