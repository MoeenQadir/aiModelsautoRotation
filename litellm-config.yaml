# ============================================================================
# MOON AI AUTO ROUTER - LiteLLM configuration
# ----------------------------------------------------------------------------
# Logical groups: coding | reasoning | backup
# OpenCode only ever sees these three names at http://127.0.0.1:4000/v1
#
# FREE-FIRST POLICY: every ACTIVE deployment below is a FREE tier endpoint.
# No paid models are configured. The single PAID exception (OpenRouter
# deepseek-chat) sits at the very end of the coding chain, also commented.
#
# KEY STATUS (verified live 2026-10-03):
#   ACTIVE  : Groq x2, Cerebras, Gemini, OpenRouter, Mistral, Cloudflare
#   PARKED  : SambaNova (valid key, account lacks payment method - 402)
#   PENDING : Together, Fireworks, NVIDIA, Qwen (commented NEEDS blocks),
#             GitHub Models (blocked upstream), paid deepseek (commented)
#
# Model IDs verified live against provider APIs on 2026-10-03:
#   - Cerebras   : GET /v1/models -> gpt-oss-120b, qwen-3.8-27b
#                  (llama-3.3-70b is GONE from Cerebras — do not re-add)
#   - Groq       : GET /openai/v1/models -> openai/gpt-oss-120b,
#                  qwen/qwen3.8-27b (llama-3.3-70b-versatile is GONE)
#   - OpenRouter : GET /api/v1/models -> the :free slugs below (17 free models
#                  today; deepseek :free variants are GONE — deepseek-chat is
#                  paid on OpenRouter now)
#   - Gemini     : gemini-flash-latest is a rolling alias Google maintains that
#                  always points at the current Flash model (no dead model IDs).
#   - GitHub Models : https://models.github.ai/inference still returns a
#                  non-JSON "OK" body for this token (re-checked 2026-10-03),
#                  so that block stays commented out.
#
# PRIORITY: within each group the router tries deployments top-to-bottom,
# so the strongest/fastest models sit at the top (spec: best-first).
#
# When a provider deprecates a model: update ONLY this file, restart Docker.
# OpenCode needs no changes.
# ============================================================================

model_list:
  # ==========================================================================
  # CODING GROUP  (chain: coding -> reasoning -> backup)
  # 1-2. Groq gpt-oss-120b (key #1 -> key #2 rotation)
  # 3.  Groq qwen3.8-27b
  # 4.  Cerebras gpt-oss-120b
  # 5.  Mistral codestral-latest (ACTIVE 2026-10-03)
  # 6.  Cloudflare llama-3.3-70b-fp8-fast (ACTIVE 2026-10-03)
  #       (SambaNova parked: key valid but account needs a payment method
  #       on file at cloud.sambanova.ai/plans/billing before inference;
  #       Together / Fireworks / NVIDIA / Qwen stay commented pending keys)
  # 8.  OpenRouter qwen3.8-27b:free
  # 9.  OpenRouter nemotron-3-ultra:free
  # 10. (PAID, commented) OpenRouter deepseek/deepseek-chat — last resort
  # ==========================================================================
  - model_name: coding
    litellm_params:
      model: groq/openai/gpt-oss-120b     # Groq flagship, ~500 tok/s, 131k ctx
      api_key: os.environ/GROQ_API_KEY_1
      additional_drop_params: ["reasoningSummary"]   # OpenCode-only param
    model_info:
      max_output_tokens: 65536            # clamp OpenCode's big max_tokens

  - model_name: coding
    litellm_params:
      model: groq/openai/gpt-oss-120b     # same model, second key = rotation
      api_key: os.environ/GROQ_API_KEY_2
      additional_drop_params: ["reasoningSummary"]
    model_info:
      max_output_tokens: 65536

  # --- NEW: Groq qwen3.8-27b (verified in the account's /openai/v1/models
  #     response on 2026-10-03; same weights as the OpenRouter free tier but
  #     on your own Groq quota, and faster) ---
  - model_name: coding
    litellm_params:
      model: groq/qwen/qwen3.8-27b
      api_key: os.environ/GROQ_API_KEY_1
      additional_drop_params: ["reasoningSummary"]
    model_info:
      max_output_tokens: 32768

  - model_name: coding
    litellm_params:
      model: cerebras/gpt-oss-120b        # ~3000 tok/s, 65k ctx (free tier)
      api_key: os.environ/CEREBRAS_API_KEY
      additional_drop_params: ["reasoningSummary"]
    model_info:
      max_output_tokens: 32768

  # --- Mistral Codestral (ACTIVE 2026-10-03: key verified live and
  #     codestral-latest present in the account's /v1/models response).
  #     Dedicated code model, 256k ctx, near the top for coding requests. ---
  - model_name: coding
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY
      additional_drop_params: ["reasoningSummary"]
      rpm: 20
    model_info:
      max_output_tokens: 16384

  # --- SambaNova (PARKED 2026-10-03: API key verified valid, account
  #     model list OK, but inference returns HTTP 402 PAYMENT_METHOD_REQUIRED.
  #     SambaNova now requires a payment method on file for the account:
  #     add one at https://cloud.sambanova.ai/plans/billing (free tier is not
  #     charged), then uncomment this block. ---
  # - model_name: coding
  #   litellm_params:
