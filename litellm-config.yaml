  #     rpm: 15
  #   model_info:
  #     max_output_tokens: 8192

  # --- NEEDS: FIREWORKS_API_KEY  (fireworks.ai — free trial credits).
  #     Full model path is required by the Fireworks API. ---
  # - model_name: coding
  #   litellm_params:
  #     model: fireworks_ai/accounts/fireworks/models/llama-v3p1-70b-instruct
  #     api_key: os.environ/FIREWORKS_API_KEY
  #     additional_drop_params: ["reasoningSummary"]
  #     rpm: 15
