  #     max_output_tokens: 8192

  # --- NEEDS: TOGETHER_API_KEY  (api.together.ai — free tier endpoints).
  #     Using the "-Turbo-Free" free-serving variant; drop "-Free" for the
  #     paid Turbo endpoint. ---
  # - model_name: coding
  #   litellm_params:
  #     model: together_ai/meta-llama/Llama-3.3-70B-Instruct-Turbo-Free
  #     api_key: os.environ/TOGETHER_API_KEY
