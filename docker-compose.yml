services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: moon-ai-router
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      # Custom pre-call hooks (strip replayed reasoning_content from
      # assistant messages - strict providers like Cerebras reject it)
      - ./litellm_hooks.py:/app/litellm_hooks.py:ro
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys; sys.exit(0 if
          urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=5).status==200
          else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
